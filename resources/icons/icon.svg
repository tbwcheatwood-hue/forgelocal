<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ForgeLocal">
  <defs>
    <linearGradient id="bg" x1="64" y1="36" x2="448" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1714"/>
      <stop offset="55%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="copper" x1="120" y1="90" x2="390" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0c08a"/>
      <stop offset="42%" stop-color="#e0a06a"/>
      <stop offset="78%" stop-color="#c47d45"/>
      <stop offset="100%" stop-color="#8a5230"/>
    </linearGradient>
    <linearGradient id="steel" x1="160" y1="120" x2="360" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8d0c4"/>
      <stop offset="45%" stop-color="#9a9184"/>
      <stop offset="100%" stop-color="#5c564e"/>
    </linearGradient>
    <linearGradient id="ember" x1="210" y1="250" x2="310" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb070" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c45a28" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0a06a" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#e0a06a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e0a06a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="28" y="28" width="456" height="456" rx="98" fill="none" stroke="#e0a06a" stroke-opacity="0.18" stroke-width="2"/>

  <g filter="url(#soft)">
    <!-- Anvil base -->
    <path
      fill="url(#steel)"
      d="M118 348
         C118 332 132 322 156 322
         H356
         C380 322 394 332 394 348
         V362
         H364
         C360 388 348 408 328 420
         H184
         C164 408 152 388 148 362
         H118 Z"
    />
    <!-- Anvil horn + face -->
    <path
      fill="url(#copper)"
      d="M96 286
         C96 270 108 260 126 260
         H210
         L248 248
         H360
         C400 248 430 262 448 286
         C430 278 404 274 372 274
         H250
         L214 286
         H140
         C118 286 96 298 96 318
         Z"
    />
    <!-- Anvil face highlight edge -->
    <path
      fill="#f3d2a8"
      fill-opacity="0.35"
      d="M132 268 H248 L236 278 H146 C136 278 132 274 132 268 Z"
    />

    <!-- Hammer handle -->
    <path
      fill="#6b4630"
      d="M168 118
         L198 108
         L292 286
         L258 300
         Z"
    />
    <path
      fill="#8a5a38"
      fill-opacity="0.55"
      d="M176 116 L192 110 L278 268 L264 276 Z"
    />

    <!-- Hammer head -->
    <path
      fill="url(#copper)"
      d="M132 86
         C124 86 118 94 120 104
         L132 168
         C134 180 146 188 160 184
         L214 168
         C230 162 236 144 228 130
         L204 86
         C198 76 184 72 170 76
         Z"
    />
    <!-- Peen / cheek detail -->
    <path
      fill="#8a5230"
      fill-opacity="0.55"
      d="M128 112 H188 L184 132 H134 Z"
    />
    <path
      fill="#f0c08a"
      fill-opacity="0.45"
      d="M140 94 H186 L180 108 H146 Z"
    />

    <!-- Strike spark / ember under hammer -->
    <path
      fill="url(#ember)"
      d="M236 292
         L252 268
         L262 288
         L286 274
         L274 298
         L298 308
         L272 316
         L278 340
         L256 322
         L238 338
         L242 314
         L218 308
         Z"
      opacity="0.9"
    />
  </g>
</svg>
